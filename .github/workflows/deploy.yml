name: CI + Deploy

# Ce workflow :
#  1) à chaque push (main) ou PR → vérifie la syntaxe de tout le JS
#  2) après un push sur main validé → déclenche le déploiement Render
#     (via le webhook si RENDER_DEPLOY_HOOK_URL est défini, sinon Render
#      déploie de toute façon grâce à son intégration GitHub native)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la syntaxe JS
        run: |
          set -e
          for f in $(find public/js routes services database -name "*.js"); do
            node --check "$f"
          done
          node --check server.js
          echo "✓ Syntaxe valide sur tous les fichiers"

  deploy:
    name: Déployer sur Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK"
            echo "✓ Déploiement Render déclenché"
          else
            echo "RENDER_DEPLOY_HOOK_URL non défini — Render déploie automatiquement sur push (intégration GitHub native)."
          fi
