name: CI + Deploy

# Ce workflow :
#  1) à chaque push (main) ou PR → vérifie la syntaxe de tout le JS
#  2) après un push sur main validé → déploie sur Fly.io

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la syntaxe JS
        run: |
          set -e
          for f in $(find public/js routes services database -name "*.js"); do
            node --check "$f"
          done
          node --check server.js
          echo "✓ Syntaxe valide sur tous les fichiers"

  deploy:
    name: Déployer sur Fly.io
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déployer sur Fly.io
        uses: superfly/flyctl-actions/deploy@master
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
