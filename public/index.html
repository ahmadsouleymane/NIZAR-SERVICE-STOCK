<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#334155">
  <meta name="description" content="Gestion de stock - Nizar Transport Voyageur">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <title>Nizar Stock</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <!-- Login screen -->
    <div id="login-screen" class="login-screen">
      <div class="login-card">
        <div class="login-header">
          <svg class="login-icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
          <h1>Nizar Stock</h1>
          <p>Gestion de stock — Transport Voyageur</p>
        </div>
        <form id="login-form" class="login-form">
          <div class="form-group">
            <label class="form-label" for="username">Nom d'utilisateur</label>
            <input type="text" id="username" class="form-input" autocomplete="username" required autofocus>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Mot de passe</label>
            <input type="password" id="password" class="form-input" autocomplete="current-password" required>
          </div>
          <div id="login-error" class="login-error" style="display:none"></div>
          <button type="submit" class="btn btn-primary btn-full" id="login-btn">
            <span class="btn-text">Se connecter</span>
            <span class="btn-spinner" style="display:none"></span>
          </button>
        </form>
      </div>
    </div>

    <!-- Main layout -->
    <div id="main-layout" class="main-layout" style="display:none">
      <!-- Desktop sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-brand">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          <span>Nizar Stock</span>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer">
          <div class="sidebar-user">
            <span id="sidebar-username"></span>
            <span class="sidebar-role" id="sidebar-role"></span>
          </div>
        </div>
      </aside>

      <!-- Main content -->
      <main class="main-content">
        <header class="topbar">
          <div class="topbar-left">
            <button id="menu-toggle" class="btn btn-icon" aria-label="Menu">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h2 id="page-title">Tableau de bord</h2>
          </div>
          <div class="topbar-right">
            <button id="theme-toggle" class="btn btn-icon" aria-label="Changer le theme">
              <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button id="logout-btn" class="btn btn-icon" aria-label="Deconnexion" title="Deconnexion">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
          </div>
        </header>

        <div id="page-content" class="page-content">
          <!-- Pages rendu ici -->
        </div>
      </main>

      <!-- Mobile bottom nav -->
      <nav class="bottom-nav" id="bottom-nav"></nav>
    </div>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Modal container -->
    <div id="modal-overlay" class="modal-overlay" style="display:none">
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/articles.js"></script>
  <script src="/js/mouvements.js"></script>
  <script src="/js/fournisseurs.js"></script>
  <script src="/js/commandes.js"></script>
  <script src="/js/rapports.js"></script>
  <script src="/js/parametres.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
