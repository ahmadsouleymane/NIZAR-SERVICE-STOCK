<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#334155">
  <meta name="description" content="Gestion de stock - Nizar Transport Voyageur">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Nizar Stock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Polices chargees sans bloquer le rendu (media=print onload) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <!-- LOGIN -->
    <div id="login-screen" class="login-screen">
      <div class="login-card">
        <div class="login-header">
          <img src="/logo.jpeg" alt="Nizar Transport Voyageur" class="login-logo">
          <h1>Nizar Stock</h1>
          <p>Gestion de stock — Transport Voyageur</p>
        </div>
        <form id="login-form" class="login-form">
          <div class="form-group">
            <label class="form-label" for="username">Nom d'utilisateur</label>
            <input type="text" id="username" class="form-input" autocomplete="username" required autofocus>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Mot de passe</label>
            <input type="password" id="password" class="form-input" autocomplete="current-password" required>
          </div>
          <div id="login-error" class="login-error" style="display:none"></div>
          <button type="submit" class="btn btn-primary btn-full" id="login-btn">
            <span class="btn-text">Se connecter</span>
            <span class="btn-spinner" style="display:none"></span>
          </button>
        </form>
      </div>
    </div>

    <!-- MAIN LAYOUT -->
    <div id="main-layout" class="main-layout" style="display:none">
      <div class="app-shell">
        <!-- DRAWER / SIDEBAR -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <aside class="drawer" id="drawer">
          <div class="drawer-header">
            <img src="/logo.jpeg" alt="Nizar" class="drawer-logo">
            <span class="drawer-brand">Nizar Stock</span>
            <button class="drawer-close" id="drawer-close" aria-label="Fermer">&times;</button>
          </div>
          <nav class="drawer-nav" id="drawer-nav"></nav>
          <div class="drawer-footer">
            <div class="drawer-user">
              <strong id="drawer-username"></strong>
              <span class="drawer-role" id="drawer-role"></span>
            </div>
          </div>
        </aside>

        <!-- MAIN AREA -->
        <div class="main-area">
          <header class="topbar">
            <div class="topbar-left">
              <button id="menu-toggle" class="btn btn-icon" aria-label="Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
              </button>
              <h2 id="page-title">Tableau de bord</h2>
            </div>
            <div class="topbar-right">
              <button id="logout-btn-header" class="btn btn-icon" aria-label="Deconnexion" title="Deconnexion">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              </button>
            </div>
          </header>

          <div id="page-content" class="page-content"></div>
        </div>

        <!-- BOTTOM NAV (mobile) -->
        <nav class="bottom-nav" id="bottom-nav"></nav>
      </div>
    </div>

    <!-- TOAST -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- MODAL -->
    <div id="modal-overlay" class="modal-overlay" style="display:none">
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/articles.js"></script>
  <script src="/js/mouvements.js"></script>
  <script src="/js/fournisseurs.js"></script>
  <script src="/js/commandes.js"></script>
  <script src="/js/fiches.js"></script>
  <script src="/js/entrees.js"></script>
  <script src="/js/retours.js"></script>
  <script src="/js/souches.js"></script>
  <script src="/js/inventaire.js"></script>
  <script src="/js/inventaire_stock.js"></script>
  <script src="/js/rapports.js"></script>
  <script src="/js/parametres.js"></script>
  <script src="/js/trends.js"></script>
  <script src="/js/alertes.js"></script>
  <script src="/js/globalsearch.js"></script>
  <script src="/js/billets.js"></script>
  <script src="/js/app.js"></script>
  <script>
    // PWA : enregistrement du service worker (cache statique, offline)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function(err) {
          console.warn('Service worker non enregistre:', err);
        });
      });
    }
  </script>
</body>
</html>
