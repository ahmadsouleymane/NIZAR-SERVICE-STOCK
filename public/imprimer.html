<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bon de réception — Nizar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #e5e7eb; font-family: Arial, Helvetica, sans-serif; }
    .controls {
      text-align: center;
      padding: 12px;
      background: #fff;
      border-bottom: 1px solid #d1d5db;
    }
    .controls button {
      padding: 8px 18px;
      font-size: 13px;
      border: none;
      border-radius: 8px;
      background: #0EA5A0;
      color: #fff;
      cursor: pointer;
    }
    .controls .hint { color: #6B7280; font-size: 12px; margin-top: 6px; }
    #pdf-frame { display: block; width: 100%; height: calc(100vh - 62px); border: none; background: #fff; }
    #loading { padding: 40px; text-align: center; color: #6B7280; }
  </style>
</head>
<body>
  <div class="controls">
    <button id="btn-print">Imprimer ce bon de réception</button>
    <div class="hint">La boîte d'impression s'ouvre automatiquement.</div>
  </div>
  <div id="loading">Chargement du bon de réception…</div>
  <iframe id="pdf-frame" style="display:none"></iframe>

  <script>
    (function() {
      var params = new URLSearchParams(location.search);
      var id = params.get('id');
      var token = localStorage.getItem('nizar_token');

      function showError(msg) {
        document.getElementById('loading').innerHTML = '<span style="color:#DC2626">' + msg + '</span>';
      }

      if (!id || !token) { showError('Bon de réception introuvable ou session expirée.'); return; }

      // Charger le PDF du modele (avec les donnees) puis l'imprimer directement
      fetch('/api/fiches/' + id + '/pdf', { headers: { 'Authorization': 'Bearer ' + token } })
        .then(function(r) { if (!r.ok) throw new Error('Erreur ' + r.status); return r.blob(); })
        .then(function(blob) {
          var url = URL.createObjectURL(blob);
          var frame = document.getElementById('pdf-frame');
          var loading = document.getElementById('loading');
          frame.src = url;
          frame.style.display = 'block';
          if (loading) loading.style.display = 'none';
          // Laisser le temps au PDF de s'afficher puis ouvrir la boite d'impression
          setTimeout(function() {
            try { frame.contentWindow.print(); } catch (e) { /* ignore */ }
          }, 900);
        })
        .catch(function(err) {
          showError('Impossible de charger le PDF : ' + err.message);
        });

      document.getElementById('btn-print').addEventListener('click', function() {
        var frame = document.getElementById('pdf-frame');
        try { frame.contentWindow.print(); } catch (e) { /* ignore */ }
      });
    })();
  </script>
</body>
</html>
