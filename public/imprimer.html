<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impression fiche de réception — Nizar</title>
  <style>
    /* ===== Page A4 ===== */
    @page { size: A4; margin: 12mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
      color: #111827;
      background: #fff;
      font-size: 12px;
      line-height: 1.4;
    }
    .sheet {
      max-width: 190mm;
      margin: 0 auto;
      padding: 6mm;
      border: 1.5px solid #0EA5A0;
      border-radius: 6px;
    }
    /* ===== En-tête ===== */
    .head { display: flex; align-items: center; gap: 10px; border-bottom: 2.5px solid #0EA5A0; padding-bottom: 6px; margin-bottom: 10px; }
    .head img { height: 46px; width: 46px; object-fit: contain; }
    .head .brand { flex: 1; }
    .head h1 { font-size: 15px; color: #111827; letter-spacing: 0.5px; }
    .head h2 { font-size: 20px; color: #0EA5A0; margin-top: 2px; }
    /* ===== Informations ===== */
    .info { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-bottom: 10px; font-size: 11.5px; }
    .info .k { color: #6B7280; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.4px; }
    .info .v { font-weight: 600; }
    /* ===== Tableau ===== */
    table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    th { background: #111827; color: #fff; text-align: left; padding: 5px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; }
    td { border-bottom: 1px solid #E5E7EB; padding: 5px 6px; font-size: 11.5px; }
    tr:nth-child(even) td { background: #F9FAFB; }
    /* ===== Signatures ===== */
    .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 28px; }
    .sign .box { text-align: center; }
    .sign .line { border-top: 1px solid #111827; margin-top: 30px; padding-top: 3px; font-weight: 600; font-size: 11px; }
    .sign .sub { color: #6B7280; font-size: 9.5px; }
    /* ===== Note ===== */
    .note { text-align: center; margin-top: 16px; font-size: 10.5px; font-weight: 700; color: #0EA5A0; }
    .foot { text-align: center; margin-top: 12px; color: #9CA3AF; font-size: 8.5px; }
    /* ===== Controles hors impression ===== */
    .no-print { text-align: center; margin: 14px auto; max-width: 190mm; }
    .no-print button { padding: 8px 18px; font-size: 13px; border: none; border-radius: 8px; background: #0EA5A0; color: #fff; cursor: pointer; }
    .no-print .hint { color: #6B7280; font-size: 12px; margin-top: 8px; }
    #loading { text-align: center; padding: 40px 0; color: #6B7280; }
    @media print {
      .no-print { display: none !important; }
      .sheet { border: none; padding: 0; }
    }
  </style>
</head>
<body>
  <div class="no-print"><button id="btn-print">Imprimer cette fiche</button><div class="hint">La boîte d'impression s'ouvre automatiquement.</div></div>
  <div id="sheet-container"><div id="loading">Chargement de la fiche…</div></div>

  <script>
    (function() {
      var params = new URLSearchParams(location.search);
      var id = params.get('id');
      var token = localStorage.getItem('nizar_token');

      function esc(s) { if (s === null || s === undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
      function fmtDate(iso) { if (!iso) return '-'; var d = new Date(iso); if (isNaN(d.getTime())) return iso; return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear(); }

      function render(fiche, lignes) {
        var dest = esc(fiche.localite_nom || '-') + (fiche.localite_service ? ' — Siège' : (fiche.localite_type === 'international' ? ' — ' + (fiche.localite_pays || 'International') : ' — National'));
        var rows = '';
        if (!lignes || !lignes.length) {
          rows = '<tr><td colspan="5">Aucun article</td></tr>';
        } else {
          for (var i = 0; i < lignes.length; i++) {
            var l = lignes[i];
            rows += '<tr><td>' + esc(l.article_nom || '-') + '</td><td>' + esc(l.numero_debut || '-') + '</td><td>' + esc(l.numero_fin || '-') + '</td><td>' + (l.quantite || '-') + '</td><td>' + esc(l.unite || 'piece') + '</td></tr>';
          }
        }
        document.getElementById('sheet-container').innerHTML =
          '<div class="sheet">' +
            '<div class="head">' +
              '<img src="/logo.jpeg" alt="Nizar">' +
              '<div class="brand"><h1>NIZAR TRANSPORT VOYAGEUR</h1><h2>FICHE DE RÉCEPTION</h2></div>' +
            '</div>' +
            '<div class="info">' +
              '<div><div class="k">Référence</div><div class="v">' + esc(fiche.reference || '-') + '</div></div>' +
              '<div><div class="k">N° Facture</div><div class="v">' + esc(fiche.numero_facture || '-') + '</div></div>' +
              '<div><div class="k">Date</div><div class="v">' + fmtDate(fiche.date_envoi || fiche.date_creation) + '</div></div>' +
              '<div><div class="k">Destination</div><div class="v">' + dest + '</div></div>' +
              '<div><div class="k">Destinataire</div><div class="v">' + esc(fiche.destinataire || '-') + '</div></div>' +
              '<div><div class="k">Documents</div><div class="v">Bon de livraison / Facture</div></div>' +
            '</div>' +
            '<table><thead><tr><th style="width:34%">Article</th><th style="width:18%">N° début</th><th style="width:18%">N° fin</th><th style="width:10%">Qté</th><th style="width:20%">Unité</th></tr></thead><tbody>' + rows + '</tbody></table>' +
            '<div class="sign">' +
              '<div class="box"><div class="line">Gestionnaire de stock</div><div class="sub">Cachet et signature</div></div>' +
              '<div class="box"><div class="line">Chef d\'agence</div><div class="sub">Date et signature à la réception</div></div>' +
            '</div>' +
            '<div class="note">NB : A renvoyer au service stock dès réception</div>' +
            '<div class="foot">Nizar Stock — Nizar Transport Voyageur — Document généré le ' + new Date().toLocaleDateString('fr-FR') + '</div>' +
          '</div>';
        // Impression automatique
        setTimeout(function() { window.print(); }, 350);
      }

      if (!id || !token) {
        document.getElementById('sheet-container').innerHTML = '<div class="no-print" style="color:#DC2626">Fiche introuvable ou session expirée.</div>';
        return;
      }

      fetch('/api/fiches/' + id, { headers: { 'Authorization': 'Bearer ' + token } })
        .then(function(r) { if (!r.ok) throw new Error('Erreur ' + r.status); return r.json(); })
        .then(function(data) { render(data.fiche, data.lignes); })
        .catch(function(err) {
          document.getElementById('sheet-container').innerHTML = '<div class="no-print" style="color:#DC2626">Impossible de charger la fiche : ' + esc(err.message) + '</div>';
        });

      document.getElementById('btn-print').addEventListener('click', function() { window.print(); });
    })();
  </script>
</body>
</html>
